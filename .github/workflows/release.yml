name: Release

# Builds the alpha archives on a version tag and attaches them to a GitHub
# pre-release. Manual runs only build and upload the archives as artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p game-client -p game-server
      - run: python tools/package.py windows-client
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip*

  linux:
    # 22.04 (glibc 2.35) so the binaries run on Debian 12 / Ubuntu 22.04 VPS.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p game-client -p game-server
      - run: python3 tools/package.py linux-server
      - run: python3 tools/package.py linux-client
      - name: Smoke test of the packaged server
        run: |
          mkdir smoke && tar xzf dist/Project-S-Dedicated-Server-Linux-x64.tar.gz -C smoke
          cd smoke/projet-s-server && ./projet-s-server --check --config deploy/server.example.toml
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --prerelease --verify-tag \
            --title "Project S — ${GITHUB_REF_NAME}" \
            --notes-file docs/release-notes.md
