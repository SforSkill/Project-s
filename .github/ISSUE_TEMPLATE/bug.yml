name: Bug
description: Un comportement incorrect du jeu, du serveur ou des outils.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Ce qui se passe
      description: Ce que tu as observé, et ce que tu attendais.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduire
      description: Étapes, carte, mode, nombre de joueurs ou de bots.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Sortie de `Project-S --version` ou `projet-s-server --version`.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Plateforme
      options: [Windows, Linux, Serveur dédié (Docker), Serveur dédié (systemd)]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Journaux, captures, replay (.psrp)
      render: text
