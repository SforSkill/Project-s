# Agones Fleet skeleton for Projet S (not validated on a cluster, see README.md).
# The server does not integrate the Agones SDK yet: it does not call Ready() /
# Allocate() / Shutdown(). Until it does, Agones' health checks cannot be used
# and a sidecar must mark the GameServer Ready (see README.md, "Gaps").
apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: projet-s
spec:
  replicas: 2
  template:
    spec:
      ports:
        - name: game
          portPolicy: Dynamic
          containerPort: 27015
          protocol: UDP
      health:
        disabled: true
      template:
        spec:
          containers:
            - name: projet-s
              image: ghcr.io/thaskow/projet-s-server:0.1.0-alpha
              args: ["--map", "ps_citadel", "--mode", "competitive"]
              resources:
                requests: { cpu: "1", memory: 256Mi }
                limits: { cpu: "2", memory: 512Mi }
