# Skeleton chart: one pod = one match server. Not validated on a real cluster
# (see docs/deployment.md). For fleets and allocation use Agones (deploy/agones).
image:
  repository: ghcr.io/thaskow/projet-s-server
  tag: "0.1.0-alpha"
  pullPolicy: IfNotPresent
replicas: 1
server:
  map: ps_citadel
  mode: competitive
  tickRate: 128
  bots: 0
  fillBots: false
# Existing Secret holding key PROJET_S_ADMIN_TOKEN (create it out of band).
adminTokenSecret: ""
service:
  # Game traffic is UDP; NodePort/LoadBalancer depends on the cluster.
  type: LoadBalancer
  gamePort: 27015
resources:
  requests: { cpu: "1", memory: 256Mi }
  limits: { cpu: "2", memory: 512Mi }
nodeSelector: {}
tolerations: []
