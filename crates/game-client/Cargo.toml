[package]
name = "game-client"
description = "Projet S: game client (Bevy renderer, egui interface, local listen server)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "Project-S"
path = "src/main.rs"

[dependencies]
engine-core.workspace = true
engine-physics.workspace = true
engine-movement.workspace = true
engine-network.workspace = true
engine-weapons.workspace = true
game-rules.workspace = true
game-sim.workspace = true
game-server.workspace = true
game-netclient.workspace = true
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
tracing.workspace = true
bevy = { version = "0.20.1", default-features = false, features = [
    "default_app",
    "std",
    "bevy_winit",
    "multi_threaded",
    "x11",
    "wayland",
    "3d_bevy_render",
    "bevy_audio",
    "wav",
    "png",
    "tonemapping_luts",
] }
bevy_egui = { version = "0.43.1", default-features = false, features = ["render", "default_fonts"] }

[lints]
workspace = true
