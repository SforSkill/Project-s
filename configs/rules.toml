# Projet S — rule profiles. Selected with `--rules <profile>` (server) or the UI.
# Every field not listed takes the default value documented in crates/game-rules.

# Official format: MR15 (first to 16), overtime MR3 at 10000.
[competitive]
mode = "competitive"
max_rounds = 30
team_size = 5
warmup_time = 60.0
freeze_time = 15.0
buy_time = 20.0
round_time = 115.0
round_end_delay = 5.0
halftime_delay = 15.0

[competitive.overtime]
enabled = true
rounds = 6
start_money = 10000

[competitive.bomb]
enabled = true
timer = 40.0
plant_time = 3.2
defuse_time = 10.0
defuse_time_kit = 5.0

[competitive_mr12]
mode = "competitive"
max_rounds = 24
team_size = 5

[competitive_mr16]
mode = "competitive"
max_rounds = 32
team_size = 5

# 1v1: short rounds, no bomb, no economy, rifle + pistol + full armor.
[duel]
mode = "duel"
max_rounds = 16
team_size = 1
warmup_time = 20.0
freeze_time = 3.0
buy_time = 0.0
round_time = 60.0
round_end_delay = 3.0
halftime_delay = 3.0
free_armor = true
free_loadout = ["rifle", "pistol"]

[duel.economy]
enabled = false

[duel.bomb]
enabled = false

[duel.overtime]
enabled = true
rounds = 2
start_money = 0

[deathmatch]
mode = "deathmatch"
team_size = 16
warmup_time = 0.0
freeze_time = 0.0
round_time = 600.0
time_limit = 600.0
respawn_time = 2.0
free_armor = true
buy_anywhere = true
free_loadout = ["rifle", "pistol"]

[deathmatch.economy]
enabled = false

[deathmatch.bomb]
enabled = false

[training]
mode = "training"
team_size = 16
warmup_time = 0.0
freeze_time = 0.0
round_time = 3600.0
respawn_time = 0.5
buy_anywhere = true
free_loadout = ["rifle", "pistol"]

[training.economy]
enabled = false

[training.bomb]
enabled = false
