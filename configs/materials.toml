# Projet S — surface materials (wallbang). Index 0 must be "clip" (invisible player clips).
# penetration_modifier: penetration power consumed per 8 u of thickness (0 = impenetrable).
# damage_retention_per_unit: damage kept per unit crossed (deterministic, damage × r^thickness).
# entry_loss: fraction of damage lost entering the surface.
# color: linear RGB used by the client renderer.

[[materials]]
name = "clip"
penetration_modifier = 0.0
color = [0.0, 0.0, 0.0]
sound = "none"

