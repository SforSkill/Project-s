[workspace]
resolver = "3"
members = ["crates/ps-client", "crates/ps-netclient"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.90"
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/SforSkill/Project-s"

[workspace.dependencies]
ps-netclient = { path = "crates/ps-netclient" }

ps-transport = { git = "https://github.com/SforSkill/Project-s-netcode", tag = "v0.1.0" }
ps-sim-core = { git = "https://github.com/SforSkill/Project-s-simulation", tag = "v0.1.0" }
ps-physics = { git = "https://github.com/SforSkill/Project-s-simulation", tag = "v0.1.0" }
ps-movement = { git = "https://github.com/SforSkill/Project-s-simulation", tag = "v0.1.0" }
ps-weapons = { git = "https://github.com/SforSkill/Project-s-simulation", tag = "v0.1.0" }
ps-hitreg = { git = "https://github.com/SforSkill/Project-s-simulation", tag = "v0.1.0" }
ps-rules = { git = "https://github.com/SforSkill/Project-s-simulation", tag = "v0.1.0" }
ps-sim = { git = "https://github.com/SforSkill/Project-s-simulation", tag = "v0.1.0" }
ps-sim-net = { git = "https://github.com/SforSkill/Project-s-simulation", tag = "v0.1.0" }
ps-engine-character = { git = "https://github.com/SforSkill/Project-s-engine", tag = "v0.1.1" }
# Embedded local server: never the `admin` feature (HTTP API, Prometheus) in the client.
ps-server = { git = "https://github.com/SforSkill/Project-s-server", tag = "v0.2.0-alpha.1", default-features = false }

# glam 0.33 is the version re-exported by bevy_math 0.20: the shared simulation and
# the client use the very same vector types.
glam = { version = "0.33", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
